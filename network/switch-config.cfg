! Configuration du Switch Principal - PRESAT LAN
! Sécurisation et isolation des flux (Vidéosurveillance & Internet Satellite)
!
hostname Switch-Presat-Main
!
! 1. Création des VLANs
vlan 10
 name Administration_PC
vlan 20
 name Videosurveillance_IP
vlan 30
 name Wi-Fi_Tooway_Guest
!
! 2. Configuration des interfaces pour les caméras IP (VLAN 20)
interface range FastEthernet0/1 - 8
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 description Interfaces_Camaras_NVR
!
! 3. Configuration de l'interface vers le Modem Satellite Tooway (VLAN 30)
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 30
 description Liaison_Modem_Satellite_Tooway
!
! 4. Sécurisation des accès administratifs
line vty 0 4
 login local
 transport input ssh
!
end
